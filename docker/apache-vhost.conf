<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	DirectoryIndex index.php
	LimitRequestBody 131072
	Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' https://images.unsplash.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "DENY"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	<Directory /var/www/html/backend>
		Require all denied
	</Directory>

	<Directory /var/www/html/database>
		Require all denied
	</Directory>

	<Directory /var/www/html/Docs>
		Require all denied
	</Directory>

	<Directory /var/www/html/docker>
		Require all denied
	</Directory>

	<Directory /var/www/html/.git>
		Require all denied
	</Directory>

	<FilesMatch "(^\.|\.sql$|\.md$|^Dockerfile$|^compose\.yaml$)">
		Require all denied
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>