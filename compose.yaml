services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "${DB_HOST_PORT:-3307}"
      DB_NAME: moviedatabase
      DB_USER: ${DB_USER:-movieapp}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${DB_GATEWAY_IP:-172.17.0.1}:${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: moviedatabase
      MYSQL_USER: ${DB_USER:-movieapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data: